[project]
name = "flick"
version = "0.1.0"
description = "A typed-decision iPhone Simulator reflex agent: Jev chooses, idb acts."
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1"]

[project.scripts]
flick = "flick.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.4,<9",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
